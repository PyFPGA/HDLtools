name: 'lint'

on:
  push:
    paths:
      - 'hdltools/**'
      - 'tests/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Install dependencies
      run: pip install pycodestyle pylint pyslang
    - name: Run lint
      run: make lint
