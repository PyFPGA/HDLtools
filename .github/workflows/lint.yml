name: 'lint'

on: push

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.15'
    - name: Install dependencies
      run: pip install pycodestyle pylint
    - name: Run lint
      run: make lint
